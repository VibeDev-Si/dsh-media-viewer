name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check (host + client)
        shell: bash
        run: |
          node --check index.js
          cp client.js "$RUNNER_TEMP/client-check.cjs"
          node --check "$RUNNER_TEMP/client-check.cjs"

      # Real HTTP against the host half: Range, containment (.., absolute,
      # symlink escape), forged Host, sandboxed-iframe sub-resources.
      - name: Route tests
        run: npm test

  package:
    name: package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tarball contains exactly the shipped files
        shell: bash
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const files = require("./pack.json")[0].files.map(f => f.path).sort();
            const want = ["LICENSE","README.md","client.js","cordis.patch.yml","icon.svg","index.js","package.json"];
            if (JSON.stringify(files) !== JSON.stringify(want)) {
              console.error("unexpected tarball contents:", files);
              process.exit(1);
            }
            console.log("ok:", files.join(", "));
          '
